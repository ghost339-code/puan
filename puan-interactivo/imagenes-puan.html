<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿De dónde es esta imagen? - Puan</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f3f5;
            color: #222;
            text-align: center;
        }

        header {
            background: #245b75;
            color: white;
            padding: 22px 12px;
        }

        h1 {
            margin: 0;
        }

        main {
            width: 92%;
            max-width: 760px;
            margin: 28px auto;
            background: white;
            padding: 24px;
            border-radius: 14px;
            box-shadow: 0 3px 14px #00000018;
        }

        #puntaje {
            font-size: 22px;
            color: #245b75;
        }

        #progreso {
            color: #555;
        }

        .imagen {
            display: block;
            width: 100%;
            max-height: 430px;
            object-fit: contain;
            margin: 18px auto;
            border-radius: 8px;
            background: #eee;
        }

        .opciones {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin: 20px 0;
        }

        .opcion, .boton {
            border: 0;
            border-radius: 8px;
            padding: 12px 18px;
            background: #245b75;
            color: white;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .opcion:hover, .boton:hover {
            background: #173e52;
        }

        .opcion:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #mensaje {
            min-height: 28px;
            font-weight: bold;
            font-size: 18px;
        }

        #volver {
            margin-top: 15px;
            background: #3caea3;
        }

        #volver:hover {
            background: #27877e;
        }

        #resultadoFinal {
            display: none;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>¿De dónde es esta imagen?</h1>
</header>

<main>

    <h3 id="puntaje">Puntaje: 0 puntos</h3>

    <h3 id="progreso">Imagen 1 de 11</h3>

    <img
        id="imagen"
        class="imagen"
        src="img/terminal.jpg"
        alt="Lugar de Puan"
    >

    <h2 id="pregunta">¿Qué lugar aparece?</h2>

    <div class="opciones" id="opciones"></div>

    <p id="mensaje"></p>

    <div id="resultadoFinal">
        <h2>¡Juego terminado!</h2>
        <h3 id="puntajeFinal"></h3>
        <p>Tu resultado fue guardado correctamente.</p>
    </div>

    <a class="boton" href="menu.html" id="volver">
        Volver al menú
    </a>

</main>

<script>

// ===================================
// PREGUNTAS E IMÁGENES
// ===================================

const preguntas = [
    {
        imagen: "img/terminal.jpg",
        correcta: "Terminal",
        opciones: ["Terminal", "Escuela Almafuerte", "Polideportivo"]
    },
    {
        imagen: "img/palomar.jpg",
        correcta: "Palomar",
        opciones: ["Museo", "Palomar", "Estación de tren"]
    },
    {
        imagen: "img/estaciondetren.jpg",
        correcta: "Estación de tren",
        opciones: ["Estación de tren", "malteria", "Laguna de Puan"]
    },
    {
        imagen: "img/ruinas.jpg",
        correcta: "Ruinas históricas",
        opciones: ["Predio FNCC", "Ruinas históricas", "Terminal"]
    },
    {
        imagen: "img/predio.jpg",
        correcta: "Predio FNCC",
        opciones: ["Polideportivo", "Predio FNCC", "Museo"]
    },
    {
        imagen: "img/fuerte.jpg",
        correcta: "fuerte de puan",
        opciones: ["entrada de puan", "fuerte de puan", "Polideportivo"]
    },
    {
        imagen: "img/polideportivo.jpg",
        correcta: "Polideportivo",
        opciones: ["Laguna de Puan", "Predio FNCC", "Polideportivo"]
    },
    {
        imagen: "img/centrodeinformatica.jpg",
        correcta: "Centro de Informática",
        opciones: ["Museo", "Centro de Informática", "Escuela Almafuerte"]
    },
    {
        imagen: "img/museo.jpg",
        correcta: "Museo",
        opciones: ["Palomar", "Museo", "Terminal"]
    },
    {
        imagen: "img/laguna.jpg",
        correcta: "Laguna de Puan",
        opciones: ["Laguna de Puan", "malteria", "Ruinas históricas"]
    },
    {
        imagen: "img/malteria.jpg",
        correcta: "malteria",
        opciones: ["Estación de tren", "malteria", "Centro de Informática"]
    }
];


// ===================================
// VARIABLES
// ===================================

let numeroImagen = 0;
let puntosActividad = 0;
let respondido = false;
let resultadoGuardado = false;


// ===================================
// ELEMENTOS HTML
// ===================================

const imagen = document.getElementById("imagen");
const opciones = document.getElementById("opciones");
const mensaje = document.getElementById("mensaje");
const puntajeTexto = document.getElementById("puntaje");
const progreso = document.getElementById("progreso");
const pregunta = document.getElementById("pregunta");
const resultadoFinal = document.getElementById("resultadoFinal");


// ===================================
// ACTUALIZAR PUNTAJE
// ===================================

function actualizarPuntaje() {

    puntajeTexto.textContent =
        "Puntaje: " + puntosActividad + " puntos";

}


// ===================================
// GUARDAR PUNTAJE GENERAL
// ===================================

function sumarPuntos(cantidad) {

    let total = Number(
        localStorage.getItem("puan_puntaje") || 0
    );

    total += cantidad;

    localStorage.setItem("puan_puntaje", total);

}


// ===================================
// GUARDAR RESULTADO FINAL
// ===================================

function guardarResultado() {

    if (resultadoGuardado) return;

    resultadoGuardado = true;

    const nombre =
        localStorage.getItem("puan_nombre") || "Participante";

    const resultado = {
        nombre: nombre,
        actividad: "Imágenes de Puan",
        puntaje: puntosActividad,
        fecha: new Date().toLocaleDateString("es-AR")
    };

    let resultados = JSON.parse(
        localStorage.getItem("puan_resultados") || "[]"
    );

    resultados.push(resultado);

    localStorage.setItem(
        "puan_resultados",
        JSON.stringify(resultados)
    );

}


// ===================================
// CARGAR IMAGEN
// ===================================

function cargarImagen() {

    if (numeroImagen >= preguntas.length) {
        terminarJuego();
        return;
    }

    respondido = false;

    const actual = preguntas[numeroImagen];

    imagen.style.display = "block";
    progreso.style.display = "block";
    pregunta.style.display = "block";
    opciones.style.display = "flex";

    resultadoFinal.style.display = "none";

    imagen.src = actual.imagen;

    imagen.alt = "Imagen de Puan";

    imagen.onerror = function() {
        mensaje.textContent =
            "No se pudo cargar la imagen: " + actual.imagen;

        mensaje.style.color = "red";
    };

    progreso.textContent =
        "Imagen " + (numeroImagen + 1) +
        " de " + preguntas.length;

    pregunta.textContent = "¿Qué lugar aparece?";

    mensaje.textContent = "";

    opciones.innerHTML = "";

    actual.opciones.forEach(function(respuesta) {

        const boton = document.createElement("button");

        boton.className = "opcion";

        boton.textContent = respuesta;

        boton.addEventListener("click", function() {
            comprobarRespuesta(respuesta);
        });

        opciones.appendChild(boton);

    });

    actualizarPuntaje();

}


// ===================================
// COMPROBAR RESPUESTA
// ===================================

function comprobarRespuesta(respuesta) {

    if (respondido) return;

    respondido = true;

    const correcta = preguntas[numeroImagen].correcta;

    if (respuesta === correcta) {

        mensaje.textContent =
            "¡Correcto! Sumaste 10 puntos.";

        mensaje.style.color = "green";

        puntosActividad += 10;

        sumarPuntos(10);

    } else {

        mensaje.textContent =
            "¡Incorrecto! La respuesta correcta era: " + correcta;

        mensaje.style.color = "red";

    }

    opciones.querySelectorAll("button").forEach(function(boton) {
        boton.disabled = true;
    });

    actualizarPuntaje();

    setTimeout(function() {

        numeroImagen++;

        cargarImagen();

    }, 1500);

}


// ===================================
// TERMINAR JUEGO
// ===================================

function terminarJuego() {

    imagen.style.display = "none";
    progreso.style.display = "none";
    pregunta.style.display = "none";
    opciones.style.display = "none";

    guardarResultado();

    mensaje.textContent = "¡Completaste todas las imágenes!";

    mensaje.style.color = "green";

    puntajeTexto.textContent =
        "Puntaje final: " + puntosActividad + " puntos";

    document.getElementById("puntajeFinal").textContent =
        "Obtuviste " + puntosActividad + " de 110 puntos.";

    resultadoFinal.style.display = "block";

}


// ===================================
// INICIAR JUEGO
// ===================================

cargarImagen();

</script>

</body>
</html>
